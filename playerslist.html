<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Players List - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@latest/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white shadow-md relative">
    <div class="max-w-7xl mx-auto px-4 py-3 relative flex items-center justify-center">
      <p onclick="window.location.href='admin.html'" class="absolute left-4 text-gray-700 cursor-pointer">
        <i class="fas fa-arrow-left text-2xl"></i>
      </p>
      <h1 class="text-xl font-bold text-gray-800">Players List</h1>
    </div>
  </header>

  <!-- Main -->
  <main class="p-4 md:p-6 space-y-6 overflow-auto flex-grow">
    <!-- Players List Section -->
    <div class="bg-white shadow rounded p-4">
      <div class="overflow-x-auto">
        <table class="min-w-full border border-gray-200 rounded-lg">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-2 text-left text-sm font-semibold text-gray-600 border-b">Photo</th>
              <th class="px-4 py-2 text-left text-sm font-semibold text-gray-600 border-b">Team</th>
              <th class="px-4 py-2 text-left text-sm font-semibold text-gray-600 border-b">Username</th>
              <th class="px-4 py-2 text-left text-sm font-semibold text-gray-600 border-b">DLS Rating</th>
              <th class="px-4 py-2 text-left text-sm font-semibold text-gray-600 border-b">Photo URL</th>
              <th class="px-4 py-2 text-center text-sm font-semibold text-gray-600 border-b">Actions</th>
            </tr>
          </thead>
          <tbody id="playersCardContainer">
            <tr>
              <td colspan="6" class="text-center text-gray-500 py-4" id="loadingText">Loading players...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Firebase + Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDooTNeDHoWUU9nLxYxyBIhewydt7Xl_M0",
      authDomain: "dlstournament-31ac1.firebaseapp.com",
      databaseURL: "https://dlstournament-31ac1-default-rtdb.firebaseio.com",
      projectId: "dlstournament-31ac1",
      storageBucket: "dlstournament-31ac1.appspot.com",
      messagingSenderId: "874377019055",
      appId: "1:874377019055:web:6e38db2ec7f0d541d2de5a",
      measurementId: "G-0DGFJEV6GL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        loadPlayers();
      }
    });

    function loadPlayers() {
      const playersRef = collection(db, "playersform");
      onSnapshot(playersRef, snapshot => {
        renderPlayers(snapshot);
      });
    }

    function renderPlayers(snapshot) {
      const container = document.getElementById("playersCardContainer");

      if (snapshot.empty) {
        container.innerHTML = `<tr><td colspan="6" class="text-center text-gray-500 py-4">No players found.</td></tr>`;
        return;
      }

      container.innerHTML = "";

      snapshot.forEach(docSnap => {
        const p = docSnap.data();
        const docId = docSnap.id;

        const imageUrl = p.photoUrl || "https://via.placeholder.com/60?text=No+Image";

        const imageId = `img-${docId}`;
        const fileInputId = `file-${docId}`;
        const photoUrlInputId = `photourl-${docId}`;
        const updateBtnId = `update-${docId}`;

        const row = document.createElement("tr");
        row.className = "border-b hover:bg-gray-50";

        row.innerHTML = `
          <td class="px-4 py-2">
            <img id="${imageId}" src="${imageUrl}" class="w-12 h-12 rounded-full object-cover border border-gray-300" />
            <input type="file" id="${fileInputId}" class="hidden" accept="image/*" />
          </td>
          <td class="px-4 py-2 text-sm text-gray-800 font-semibold">${p.team || "N/A"}</td>
          <td class="px-4 py-2 text-sm text-gray-700">${p.username || "N/A"}</td>
          <td class="px-4 py-2 text-sm text-gray-700">${p.dlsRating ?? "N/A"}</td>
          <td class="px-4 py-2">
            <input type="text" id="${photoUrlInputId}" value="${imageUrl}" class="w-full text-xs text-gray-700 border rounded px-2 py-1" />
          </td>
          <td class="px-4 py-2 text-center">
            <button id="${updateBtnId}" class="bg-green-600 text-white px-3 py-1 rounded text-xs hover:bg-green-700 transition">
              Update
            </button>
          </td>
        `;

        container.appendChild(row);

        // Handle direct photoUrl update
        const updateBtn = row.querySelector(`#${updateBtnId}`);
        const photoUrlInput = row.querySelector(`#${photoUrlInputId}`);
        const imageEl = row.querySelector(`#${imageId}`);

        updateBtn.addEventListener("click", async () => {
          const newUrl = photoUrlInput.value.trim();
          if (!newUrl) {
            Swal.fire("Error", "Photo URL cannot be empty.", "error");
            return;
          }

          try {
            await updateDoc(doc(db, "playersform", docId), { photoUrl: newUrl });
            imageEl.src = newUrl;
            Swal.fire("Success", "Photo URL updated successfully!", "success");
          } catch (err) {
            console.error("Photo URL update error:", err);
            Swal.fire("Error", "Failed to update photo URL.", "error");
          }
        });

        // File upload logic (on double click)
        const fileInput = row.querySelector(`#${fileInputId}`);
        updateBtn.addEventListener("dblclick", () => fileInput.click());

        fileInput.addEventListener("change", async (e) => {
          const file = e.target.files[0];
          if (!file) return;

          try {
            const storageRef = ref(storage, `players/${docId}/photo.jpg`);
            await uploadBytes(storageRef, file);
            const downloadURL = await getDownloadURL(storageRef);

            await updateDoc(doc(db, "playersform", docId), { photoUrl: downloadURL });

            imageEl.src = downloadURL;
            photoUrlInput.value = downloadURL;

            Swal.fire("Success", "Photo uploaded and updated successfully!", "success");
          } catch (err) {
            console.error("Photo upload error:", err);
            Swal.fire("Error", "Failed to upload photo.", "error");
          }
        });
      });
    }
  </script>

</body>
</html>
