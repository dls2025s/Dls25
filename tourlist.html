<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tournament Setting</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@latest/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-lg rounded-lg p-6 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">Tournament Setting</h2>
    
    <form id="settingForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
        <input type="text" id="title" class="w-full p-2 border rounded focus:outline-none focus:ring focus:ring-blue-300" placeholder="Enter tournament title" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Session</label>
        <input type="text" id="session" class="w-full p-2 border rounded focus:outline-none focus:ring focus:ring-blue-300" placeholder="Enter session name (e.g. Session1)" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Entry Fee</label>
        <input type="number" id="entryFee" class="w-full p-2 border rounded focus:outline-none focus:ring focus:ring-blue-300" placeholder="Enter entry fee" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Slot</label>
        <input type="number" id="slot" class="w-full p-2 border rounded focus:outline-none focus:ring focus:ring-blue-300" placeholder="Enter total slots" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">End Time</label>
        <input type="datetime-local" id="endTime" class="w-full p-2 border rounded focus:outline-none focus:ring focus:ring-blue-300" required>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-semibold transition">
        Save Setting
      </button>
    </form>
  </div>

  <!-- Firebase Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDooTNeDHoWUU9nLxYxyBIhewydt7Xl_M0",
      authDomain: "dlstournament-31ac1.firebaseapp.com",
      databaseURL: "https://dlstournament-31ac1-default-rtdb.firebaseio.com",
      projectId: "dlstournament-31ac1",
      storageBucket: "dlstournament-31ac1.appspot.com",
      messagingSenderId: "874377019055",
      appId: "1:874377019055:web:6e38db2ec7f0d541d2de5a",
      measurementId: "G-0DGFJEV6GL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const settingForm = document.getElementById("settingForm");

    settingForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const title = document.getElementById("title").value.trim();
      const session = document.getElementById("session").value.trim();
      const entryFee = parseFloat(document.getElementById("entryFee").value);
      const slot = parseInt(document.getElementById("slot").value);
      const endTime = document.getElementById("endTime").value;

      if (!title || !session || isNaN(entryFee) || isNaN(slot) || !endTime) {
        Swal.fire("Error", "Please fill in all fields correctly.", "error");
        return;
      }

      try {
        await addDoc(collection(db, "setting"), {
          title,
          session,
          entryFee,
          slot,
          endTime,
          createdAt: serverTimestamp()
        });

        Swal.fire({
          icon: "success",
          title: "Setting Saved",
          text: "Tournament setting has been successfully added.",
          showConfirmButton: false,
          timer: 2000
        });

        settingForm.reset();
      } catch (error) {
        console.error("Error saving setting:", error);
        Swal.fire("Error", "Failed to save setting. Check console.", "error");
      }
    });
  </script>

</body>
</html>
