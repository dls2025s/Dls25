<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tournaments List - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@latest/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white shadow-md relative">
    <div class="max-w-7xl mx-auto px-4 py-3 relative flex items-center justify-center">
      <p onclick="window.location.href='admin.html'" class="absolute left-4 text-gray-700 cursor-pointer">
        <i class="fas fa-arrow-left text-2xl"></i>
      </p>
      <h1 class="text-xl font-bold text-gray-800">Tournaments List</h1>
    </div>
  </header>

  <!-- Main -->
  <main class="p-4 md:p-6 space-y-6 overflow-auto flex-grow">
    <div class="bg-white shadow rounded p-4">
      <div class="overflow-x-auto">
        <table class="min-w-full border border-gray-200 rounded-lg">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-2 text-left text-sm font-semibold text-gray-600 border-b">Title</th>
              <th class="px-4 py-2 text-left text-sm font-semibold text-gray-600 border-b">Session</th>
              <th class="px-4 py-2 text-left text-sm font-semibold text-gray-600 border-b">Entry Fee</th>
              <th class="px-4 py-2 text-left text-sm font-semibold text-gray-600 border-b">Slot</th>
              <th class="px-4 py-2 text-left text-sm font-semibold text-gray-600 border-b">End Time</th>
              <th class="px-4 py-2 text-center text-sm font-semibold text-gray-600 border-b">Status</th>
            </tr>
          </thead>
          <tbody id="tournamentListContainer">
            <tr>
              <td colspan="6" class="text-center text-gray-500 py-4" id="loadingText">Loading tournaments...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Firebase + Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDooTNeDHoWUU9nLxYxyBIhewydt7Xl_M0",
      authDomain: "dlstournament-31ac1.firebaseapp.com",
      databaseURL: "https://dlstournament-31ac1-default-rtdb.firebaseio.com",
      projectId: "dlstournament-31ac1",
      storageBucket: "dlstournament-31ac1.appspot.com",
      messagingSenderId: "874377019055",
      appId: "1:874377019055:web:6e38db2ec7f0d541d2de5a",
      measurementId: "G-0DGFJEV6GL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        loadTournaments();
      }
    });

    function loadTournaments() {
      const tournamentsRef = collection(db, "tournaments");
      onSnapshot(tournamentsRef, snapshot => {
        renderTournaments(snapshot);
      });
    }

    async function renderTournaments(snapshot) {
      const container = document.getElementById("tournamentListContainer");

      if (snapshot.empty) {
        container.innerHTML = `<tr><td colspan="6" class="text-center text-gray-500 py-4">No tournaments found.</td></tr>`;
        return;
      }

      container.innerHTML = "";

      for (const docSnap of snapshot.docs) {
        const t = docSnap.data();
        const docId = docSnap.id;

        const row = document.createElement("tr");
        row.className = "border-b hover:bg-gray-50";

        const formattedEndTime = t.endTime ? new Date(t.endTime).toLocaleString() : "N/A";
        const isActive = t.active ?? false;

        row.innerHTML = `
          <td class="px-4 py-2 text-sm text-gray-800 font-semibold">${t.title || "N/A"}</td>
          <td class="px-4 py-2 text-sm text-gray-700">${t.session || "N/A"}</td>
          <td class="px-4 py-2 text-sm text-gray-700">৳${t.entryFee ?? "N/A"}</td>
          <td class="px-4 py-2 text-sm text-gray-700">${t.slot ?? "N/A"}</td>
          <td class="px-4 py-2 text-sm text-gray-700">${formattedEndTime}</td>
          <td class="px-4 py-2 text-center">
            <button class="toggle-btn px-3 py-1 rounded text-xs ${isActive ? 'bg-green-600 text-white' : 'bg-gray-400 text-white'} hover:opacity-80 transition" id="toggle-${docId}">
              ${isActive ? 'ON' : 'OFF'}
            </button>
          </td>
        `;

        container.appendChild(row);

        // Add session team info below tournament row
        if (t.session) {
          const teamInfoRow = document.createElement("tr");
          const teamCell = document.createElement("td");
          teamCell.colSpan = 6;
          teamCell.className = "bg-gray-50 px-6 py-3";

          const teamListContainer = document.createElement("div");
          teamListContainer.className = "text-sm text-gray-700";
          teamListContainer.innerHTML = `<p class="font-semibold text-gray-800 mb-1">Teams in ${t.session}:</p><p>Loading...</p>`;

          teamCell.appendChild(teamListContainer);
          teamInfoRow.appendChild(teamCell);
          container.appendChild(teamInfoRow);

          // Load team info for that session
          loadTeamsForSession(t.session, teamListContainer);
        }

        // Toggle Active Status
        const toggleBtn = row.querySelector(`#toggle-${docId}`);
        toggleBtn.addEventListener("click", async () => {
          const newStatus = !isActive;
          try {
            await updateDoc(doc(db, "tournaments", docId), { active: newStatus });
            toggleBtn.textContent = newStatus ? "ON" : "OFF";
            toggleBtn.classList.toggle("bg-green-600", newStatus);
            toggleBtn.classList.toggle("bg-gray-400", !newStatus);
          } catch (err) {
            console.error("Error updating status:", err);
            Swal.fire("Error", "Failed to update tournament status.", "error");
          }
        });
      }
    }

    async function loadTeamsForSession(sessionName, container) {
      try {
        const sessionRef = collection(db, sessionName);
        const snapshot = await getDocs(sessionRef);

        if (snapshot.empty) {
          container.innerHTML = `<p class="text-gray-500">No teams found in ${sessionName}.</p>`;
          return;
        }

        let html = `<table class="min-w-full text-left text-sm border border-gray-200 rounded-lg">
                      <thead class="bg-gray-100">
                        <tr>
                          <th class="px-2 py-1 border-b">ID Rating</th>
                          <th class="px-2 py-1 border-b">Team Name</th>
                          <th class="px-2 py-1 border-b">TrxID</th>
                          <th class="px-2 py-1 border-b">Payment Method</th>
                          <th class="px-2 py-1 border-b">Date</th>
                        </tr>
                      </thead>
                      <tbody>`;

        snapshot.forEach(docSnap => {
          const team = docSnap.data();
          html += `<tr class="border-b hover:bg-gray-50">
                     <td class="px-2 py-1">${team.idRating ?? "N/A"}</td>
                     <td class="px-2 py-1">${team.teamName || "N/A"}</td>
                     <td class="px-2 py-1">${team.trxId || "N/A"}</td>
                     <td class="px-2 py-1">${team.paymentMethod || "N/A"}</td>
                     <td class="px-2 py-1">${team.date || "N/A"}</td>
                   </tr>`;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
      } catch (err) {
        console.error("Error loading teams:", err);
        container.innerHTML = `<p class="text-red-500">Error loading team data.</p>`;
      }
    }
  </script>

</body>
</html>
