<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@latest/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  
  <style>
    body {
      background: radial-gradient(circle at top left, #120024, #220044, #0a0014);
      color: #f5f3ff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
    }

    .header-glow {
      box-shadow: 0 0 15px rgba(150, 0, 255, 0.4), 0 0 25px rgba(128, 0, 255, 0.2);
    }
    
    nav {
      background: linear-gradient(to right, #1a0033, #26004a, #1a0033);
      box-shadow: 0 -2px 20px rgba(120, 0, 255, 0.3);
    }

    .nav-item {
      color: #d1b3ff;
      transition: all 0.3s ease;
    }

    .nav-item i {
      color: #c084fc;
      transition: all 0.3s ease;
    }

    .nav-item:hover i {
      color: #facc15;
      transform: scale(1.25);
      text-shadow: 0 0 10px #facc15;
    }

    .nav-item:hover {
      color: #facc15;
      text-shadow: 0 0 8px #facc15;
    }
    </style>
</head>
<body>

  <!-- Header -->
  <header
    class="bg-gradient-to-r from-[#0a001f] via-[#2d0055] to-[#0a001f] w-full max-w-md shadow-md py-2 px-3 mx-auto border-b border-purple-500 flex items-center justify-between header-glow rounded-b-2xl">
    <div class="flex items-center space-x-2">
      <img src="dls25.jpeg" alt="Logo" class="w-8 h-8 rounded-full border border-purple-500 shadow-md" />
      <h2 class="text-xl font-bold bg-gradient-to-r from-yellow-300 via-pink-300 to-yellow-300 bg-clip-text text-transparent"
        style="font-family: 'Audiowide', cursive;">DCL TOUR</h2>
    </div>
    <div>
      <button id="menuButton">
        <i class="fa-solid fa-bars text-white text-xl"></i>
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-grow p-4 md:p-6">
    <!-- Player Registration History -->
    <div class="max-w-6xl mx-auto bg-white shadow-lg rounded-lg p-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">Registration History</h2>
      <div id="playerList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
        <p class="text-gray-500 text-sm">Loading...</p>
      </div>
    </div>
    
  </main>

  <!-- Firebase + Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      serverTimestamp, 
      onSnapshot, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDooTNeDHoWUU9nLxYxyBIhewydt7Xl_M0",
      authDomain: "dlstournament-31ac1.firebaseapp.com",
      databaseURL: "https://dlstournament-31ac1-default-rtdb.firebaseio.com",
      projectId: "dlstournament-31ac1",
      storageBucket: "dlstournament-31ac1.appspot.com",
      messagingSenderId: "874377019055",
      appId: "1:874377019055:web:6e38db2ec7f0d541d2de5a",
      measurementId: "G-0DGFJEV6GL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = "login.html";
      }
    });

    // ✅ Load playerlist data and display
    const playerListDiv = document.getElementById("playerList");
    const playerQuery = query(collection(db, "playerlist"), orderBy("date", "desc"));

    onSnapshot(playerQuery, (snapshot) => {
      playerListDiv.innerHTML = "";
      if (snapshot.empty) {
        playerListDiv.innerHTML = `<p class='text-gray-500 text-sm'>No registered teams found.</p>`;
        return;
      }

      snapshot.forEach((doc) => {
        const data = doc.data();
        const date = data.date?.toDate ? data.date.toDate().toLocaleString() : new Date(data.date).toLocaleString();

        const card = `
          <div class="border border-gray-300 rounded-lg p-4 bg-gradient-to-br from-white to-gray-100 shadow hover:shadow-lg transition">
            <h3 class="text-lg font-bold text-blue-700 mb-2">${data.teamName}</h3>
            <p class="text-sm text-gray-700"><strong>ID Rating:</strong> ${data.idRating}</p>
            <p class="text-sm text-gray-700"><strong>Payment:</strong> ${data.paymentMethod}</p>
            <p class="text-sm text-gray-700"><strong>TrxID:</strong> ${data.trxId}</p>
            <p class="text-sm text-gray-700"><strong>Entry Fee:</strong> ${data.entryFee}</p>
            <p class="text-sm text-gray-700"><strong>Session:</strong> ${data.sessionName}</p>
            <p class="text-sm text-gray-700"><strong>Status:</strong> 
              <span class="font-semibold ${data.status === 'Pending' ? 'text-yellow-600' : data.status === 'Approved' ? 'text-green-600' : 'text-red-600'}">
                ${data.status}
              </span>
            </p>
            <p class="text-xs text-gray-500 mt-2">Date: ${date}</p>
          </div>
        `;
        playerListDiv.innerHTML += card;
      });
    });
  </script>

</body>
</html>
