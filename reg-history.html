<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@latest/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <div class="max-w-4xl mx-auto p-4">
    <h1 class="text-2xl font-bold text-center mb-6">📜 Registration History</h1>

    <div id="historyContainer" class="space-y-4 text-gray-200 text-sm">
      <p class="text-center text-gray-400">Loading registration history...</p>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // 🔥 তোমার Firebase config এখানে দাও
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const historyContainer = document.getElementById("historyContainer");

    // ✅ লগইন ইউজার চেক
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        await loadRegistrationHistory();
      } else {
        historyContainer.innerHTML = `
          <p class="text-center text-red-400 mt-10">⚠️ দয়া করে আগে লগইন করুন</p>`;
      }
    });

    // 📜 ডেটা লোড
    async function loadRegistrationHistory() {
      try {
        const querySnapshot = await getDocs(collection(db, "playerlist"));

        if (querySnapshot.empty) {
          historyContainer.innerHTML = `<p class="text-center text-gray-400 mt-10">কোনো রেজিস্ট্রেশন পাওয়া যায়নি</p>`;
          return;
        }

        historyContainer.innerHTML = ""; // clear loading

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const card = document.createElement("div");
          card.className = "bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700";

          card.innerHTML = `
            <div class="flex justify-between items-center">
              <h2 class="text-lg font-semibold text-blue-400">${data.teamName || "N/A"}</h2>
              <span class="px-2 py-1 text-xs rounded-full ${data.status === "Pending" ? "bg-yellow-600" : "bg-green-600"}">
                ${data.status || "Unknown"}
              </span>
            </div>
            <div class="mt-2 space-y-1 text-gray-300">
              <p><b>ID Rating:</b> ${data.idRating || "-"}</p>
              <p><b>Payment:</b> ${data.paymentMethod || "-"}</p>
              <p><b>Trx ID:</b> ${data.trxId || "-"}</p>
              <p><b>Entry Fee:</b> ${data.entryFee || "-"}</p>
              <p><b>Session:</b> ${data.sessionName || "-"}</p>
              <p><b>Date:</b> ${data.date ? new Date(data.date).toLocaleString() : "-"}</p>
            </div>
          `;

          historyContainer.appendChild(card);
        });
      } catch (error) {
        console.error("Error loading registration history:", error);
        historyContainer.innerHTML = `
          <p class="text-center text-red-400 mt-10">❌ ডেটা লোড করতে সমস্যা হয়েছে</p>`;
      }
    }
  </script>
</body>
</html>
