<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@latest/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white shadow-md relative">
    <div class="max-w-7xl mx-auto px-4 py-3 relative flex items-center justify-center">
      <p onclick="window.location.href='admin.html'" class="absolute left-4 text-gray-700 cursor-pointer">
        <i class="fas fa-arrow-left text-2xl"></i>
      </p>
      <h1 class="text-xl font-bold text-gray-800">Create Tournament</h1>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-grow p-4 md:p-6">
    <!-- Display Tournament List -->
    <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-lg p-4 mb-4">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">All Tournaments</h2>
      <div id="tournamentList" class="space-y-4">
        <p class="text-gray-500 text-sm">Loading tournaments...</p>
      </div>
    </div>
    
    <!-- Create Tournament Form -->
    <div class="max-w-xl mx-auto bg-white shadow-lg rounded-lg p-6 mb-8">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">Tournament Details</h2>

      <form id="createTourForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
          <input type="text" id="title" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Tournament title" required />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Session</label>
          <input type="text" id="session" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Session10 / Session11" required />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Entry Fee</label>
          <input type="number" id="entryFee" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter entry fee amount" required />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Slot</label>
          <input type="number" id="slot" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Total available slots" required />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">End Time</label>
          <input type="datetime-local" id="endTime" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required />
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
          Create Tournament
        </button>
      </form>
    </div>

    <!-- Player Registration History -->
    <div class="max-w-6xl mx-auto bg-white shadow-lg rounded-lg p-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">Registration History</h2>
      <div id="playerList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
        <p class="text-gray-500 text-sm">Loading registered teams...</p>
      </div>
    </div>
    
  </main>

  <!-- Firebase + Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      serverTimestamp, 
      onSnapshot, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDooTNeDHoWUU9nLxYxyBIhewydt7Xl_M0",
      authDomain: "dlstournament-31ac1.firebaseapp.com",
      databaseURL: "https://dlstournament-31ac1-default-rtdb.firebaseio.com",
      projectId: "dlstournament-31ac1",
      storageBucket: "dlstournament-31ac1.appspot.com",
      messagingSenderId: "874377019055",
      appId: "1:874377019055:web:6e38db2ec7f0d541d2de5a",
      measurementId: "G-0DGFJEV6GL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = "login.html";
      }
    });

    // ✅ Load playerlist data and display
    const playerListDiv = document.getElementById("playerList");
    const playerQuery = query(collection(db, "playerlist"), orderBy("date", "desc"));

    onSnapshot(playerQuery, (snapshot) => {
      playerListDiv.innerHTML = "";
      if (snapshot.empty) {
        playerListDiv.innerHTML = `<p class='text-gray-500 text-sm'>No registered teams found.</p>`;
        return;
      }

      snapshot.forEach((doc) => {
        const data = doc.data();
        const date = data.date?.toDate ? data.date.toDate().toLocaleString() : new Date(data.date).toLocaleString();

        const card = `
          <div class="border border-gray-300 rounded-lg p-4 bg-gradient-to-br from-white to-gray-100 shadow hover:shadow-lg transition">
            <h3 class="text-lg font-bold text-blue-700 mb-2">${data.teamName}</h3>
            <p class="text-sm text-gray-700"><strong>ID Rating:</strong> ${data.idRating}</p>
            <p class="text-sm text-gray-700"><strong>Payment:</strong> ${data.paymentMethod}</p>
            <p class="text-sm text-gray-700"><strong>TrxID:</strong> ${data.trxId}</p>
            <p class="text-sm text-gray-700"><strong>Entry Fee:</strong> ${data.entryFee}</p>
            <p class="text-sm text-gray-700"><strong>Session:</strong> ${data.sessionName}</p>
            <p class="text-sm text-gray-700"><strong>Status:</strong> 
              <span class="font-semibold ${data.status === 'Pending' ? 'text-yellow-600' : data.status === 'Approved' ? 'text-green-600' : 'text-red-600'}">
                ${data.status}
              </span>
            </p>
            <p class="text-xs text-gray-500 mt-2">Date: ${date}</p>
          </div>
        `;
        playerListDiv.innerHTML += card;
      });
    });
  </script>

</body>
</html>
