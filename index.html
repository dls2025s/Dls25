<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@latest/dist/tailwind.min.css" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/a2e0e6ad98.js" crossorigin="anonymous"></script>
  <style>
    .sidebar {
      transition: all 0.3s ease-in-out;
    }

    .sidebar.active {
      left: 0;
    }

    #overlay {
      transition: all 0.3s ease-in-out;
    }

    #overlay.active {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>

<body class="bg-gray-900 text-white min-h-screen">
  <!-- Header -->
  <header class="flex justify-between items-center bg-gray-800 p-4">
    <h1 class="text-lg font-bold">DCL Tournament</h1>
    <button id="menuButton" class="text-white text-2xl hidden"><i class="fas fa-bars"></i></button>
    <button id="loginButton" class="bg-blue-600 px-3 py-1 rounded-md hover:bg-blue-700">Login</button>
  </header>

  <!-- Sidebar -->
  <aside id="sidebar"
    class="sidebar fixed top-0 left-[-100%] w-64 bg-gray-800 h-full p-4 z-50 shadow-lg md:left-0 md:relative md:shadow-none md:w-64">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-lg font-semibold">Menu</h2>
      <button id="closeSidebar" class="text-white md:hidden"><i class="fas fa-times"></i></button>
    </div>
    <ul class="space-y-3">
      <li><a href="#" class="block py-2 px-3 rounded hover:bg-gray-700">Dashboard</a></li>
      <li><a href="#" class="block py-2 px-3 rounded hover:bg-gray-700">Matches</a></li>
      <li><a href="#" class="block py-2 px-3 rounded hover:bg-gray-700">Teams</a></li>
      <li><a href="#" class="block py-2 px-3 rounded hover:bg-gray-700">Points Table</a></li>
      <li><button id="logoutButton" class="w-full text-left py-2 px-3 rounded hover:bg-red-600 bg-red-500 mt-4">Logout</button></li>
    </ul>
  </aside>

  <!-- Overlay -->
  <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 opacity-0 invisible z-40"></div>

  <!-- Main Content -->
  <main class="p-4">
    <div id="fixersContainer"></div>
  </main>

  <!-- Firebase & Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDcz2VZjY8KUh5m5v8pD-GfZSwRMBegxkE",
      authDomain: "dls-tournament.firebaseapp.com",
      projectId: "dls-tournament",
      storageBucket: "dls-tournament.appspot.com",
      messagingSenderId: "592619485443",
      appId: "1:592619485443:web:6c61fd5bca74a7dc01109e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const fixersContainer = document.getElementById("fixersContainer");
    const menuButton = document.getElementById("menuButton");
    const loginButton = document.getElementById("loginButton");
    const logoutButton = document.getElementById("logoutButton");

    onAuthStateChanged(auth, (user) => {
      if (user) {
        menuButton.classList.remove("hidden");
        loginButton.classList.add("hidden");
      } else {
        menuButton.classList.add("hidden");
        loginButton.classList.remove("hidden");
      }
    });

    // Login redirect
    loginButton.addEventListener("click", () => {
      window.location.href = "login.html";
    });

    // ✅ Logout Function
    logoutButton.addEventListener("click", async () => {
      try {
        await signOut(auth);
        alert("You have been logged out successfully!");
        window.location.href = "login.html";
      } catch (error) {
        console.error("Logout Error:", error);
        alert("Error logging out. Please try again.");
      }
    });

    // Fetch Match Fixers
    async function loadFixers() {
      const fixersRef = collection(db, "fixers");
      const snapshot = await getDocs(fixersRef);
      const fixers = snapshot.docs.map(doc => doc.data());
      renderFixers(fixers);
    }

    loadFixers();

    // Date formatting
    function formatDateAndTime(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString("en-GB") + " " + date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    // Team images (example placeholder)
    const teamPhotos = {
      "barcelona": "https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg",
      "realmadrid": "https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg"
    };

    function renderFixers(fixers) {
      if (!fixers.length) {
        fixersContainer.innerHTML = `<p class="text-center text-gray-400">No matches found.</p>`;
        return;
      }

      const matchdaysMap = {};
      fixers.forEach(f => {
        const md = f.matchday || "Unknown";
        if (!matchdaysMap[md]) matchdaysMap[md] = [];
        matchdaysMap[md].push(f);
      });

      let html = "";
      Object.keys(matchdaysMap).sort().forEach(md => {
        const firstDate = matchdaysMap[md][0]?.date || "";
        html += `
          <div class="text-xl font-bold text-center mb-6 mt-8 flex justify-center items-center gap-3">
            <span>${md}</span> | <span>${firstDate ? formatDateAndTime(firstDate) : ""}</span>
          </div>
        `;

        matchdaysMap[md].sort((a, b) => a.groupName.localeCompare(b.groupName) || a.team1.localeCompare(b.team1))
          .forEach(match => {
            const team1Img = teamPhotos[match.team1.trim().toLowerCase()] || "";
            const team2Img = teamPhotos[match.team2.trim().toLowerCase()] || "";
            const t1GoalVal = match.team1Goal ?? "-";
            const t2GoalVal = match.team2Goal ?? "-";

            html += `
              <section class="mx-auto py-10 flex justify-center items-center relative rounded-lg px-4 border border-gray-500"
                style="background-image: url('stadium.jpeg'); background-size: cover; background-position: center; height: 207px;">
                <div class="absolute inset-0 bg-black opacity-60"></div>
                <div style="background: #af1f42;"
                  class="absolute top-0 left-1/8 w-full py-1 px-4 rounded-t-lg uppercase text-lg font-extrabold z-10 opacity-70 bg-gray-800 text-center border-b border-gray-400">
                  DCL SINGLE TOURNAMENT S-8
                </div>
                <div style="background: #af1f42; top: 36px;"
                  class="flex justify-center items-center w-2/4 py-1 px-4 absolute left-1/8 rounded-b-xl uppercase text-xs font-extrabold border-b border-l border-r border-gray-400 z-10 opacity-70">
                  <div>${match.groupName}</div>
                </div>
                <div style="background: #af1f42; top: 82px;"
                  class="flex justify-between w-3/4 py-1.5 px-3 absolute left-1/8 rounded-t-xl uppercase text-xs font-extrabold border-t border-l border-r border-gray-400 z-10 opacity-70">
                  <div>${formatDateAndTime(match.date)}</div>
                  <div>Time 24 Hours</div>
                </div>
                <div style="background: #a81d3f; top: 35px;"
                  class="rounded-lg shadow-lg w-full max-w-lg relative h-14 border-t border-l border-r border-gray-400 opacity-80">
                  <div class="flex justify-between p-2 uppercase mb-1">
                    <div class="text-left w-full"><h2 class="text-xs font-semibold">${match.team1}</h2></div>
                    <div class="text-right w-full"><h2 class="text-xs font-semibold">${match.team2}</h2></div>
                  </div>
                  <div class="flex justify-center items-center space-x-6 bg-white py-3 px-2 rounded-b-lg h-10 border-b border-gray-400 opacity-80">
                    <div class="text-center"><p class="text-4xl font-medium text-black">${t1GoalVal}</p></div>
                    <div class="text-center" style="position: relative; top: -16px; color: #7f152e;">
                      <i class="fas fa-futbol text-6xl bg-white rounded-full border border-gray-400"></i>
                    </div>
                    <div class="text-center"><p class="text-4xl font-medium text-black">${t2GoalVal}</p></div>
                  </div>
                  <div style="position: relative; top: -50px; right: 10px;" class="flex justify-between">
                    ${team1Img ? `<img style="border: 4px solid #f34871;" src="${team1Img}" class="w-14 h-14 rounded-full" alt="${match.team1}" />` : ""}
                  </div>
                  <div style="position: absolute; right: -10px; top: 26px;" class="text-center">
                    ${team2Img ? `<img style="border: 4px solid #f34871;" src="${team2Img}" class="w-14 h-14 rounded-full" alt="${match.team2}" />` : ""}
                  </div>
                </div>
              </section>
            `;
          });
      });

      fixersContainer.innerHTML = html;
    }

    // Sidebar toggle
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const closeSidebar = document.getElementById("closeSidebar");

    menuButton.addEventListener("click", () => {
      sidebar.classList.add("active");
      overlay.classList.add("active");
    });

    closeSidebar.addEventListener("click", () => {
      sidebar.classList.remove("active");
      overlay.classList.remove("active");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("active");
      overlay.classList.remove("active");
    });
  </script>
</body>
</html>
